[project]
name = "applypilot"
version = "0.1.0"
description = "LinkedIn jobs -> company contacts -> grounded cold emails"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.45",
  "pyyaml>=6",
  "pydantic>=2",
  "httpx>=0.27",
  "google-api-python-client>=2.130",
  "google-auth-oauthlib>=1.2",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
applypilot = "applypilot.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["applypilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
